line-length = 120

[lint]
preview = true
select = ["ALL"]
explicit-preview-rules = false
ignore = [
    # Pylint convention
    "import-outside-top-level", # import-outside-top-level
    "compare-to-empty-string", # compare-to-empty-string
    # Should probably fix these
    "unnecessary-dunder-call", # unnecessary-dunder-call
    "import-private-name", # import-private-name

    # Pylint refactor
    "too-many-statements", # too-many-statements
    "too-many-locals", # too-many-locals
    "too-many-arguments", # too-many-arguments
    "too-many-branches", # too-many-branches
    "too-many-nested-blocks", # too-many-nested-blocks
    "too-many-public-methods", # too-many-public-methods
    "too-many-positional-arguments", # too-many-positional-arguments
    "too-many-boolean-expressions", # too-many-boolean-expressions
    "too-many-return-statements", # too-many-return-statements
    "too-many-statements-in-try-clause", # too-many-statements-in-try-clause
    # Should probably fix these
    "no-self-use", # no-self-use
    "magic-value-comparison", # magic-value-comparison

    # Pylint warning
    "eq-without-hash", # eq-without-hash
    # Should probably fix these
    "unspecified-encoding", # unspecified-encoding
    "global-statement", # global-statement

    # Flake8 async
    # Should probably fix these
    "blocking-open-call-in-async-function", # blocking-open-call-in-async-function
    "blocking-path-method-in-async-function", # pathlib for async operations
    # Should probably fix these after dealing with shielding for anyio
    "async-function-with-timeout", # async-function-with-timeout

    # flake8-implicit-str-concat
    "explicit-string-concatenation", # explicit-string-concatenation

    # pyupgrade
    # `StrEnum` changes `str()` and `format()` output.  The remaining `(str, Enum)` classes
    # cross the daemon websocket protocol, RPC error payloads and benchmark CLI parsing.
    # TODO: convert these to `enum.StrEnum`
    "replace-str-enum", # replace-str-enum

    # Ruff Specific

    # This code is problematic because using instantiated types as defaults is so common across the codebase.
    # Its purpose is to prevent accidentally assigning mutable defaults. However, this is a bit overkill for that.
    # That being said, it would be nice to add some way to actually guard against that specific mutable default behavior.
    "function-call-in-dataclass-default-argument", # function-call-in-dataclass-default-argument
    "falsy-dict-get-fallback", # falsy-dict-get-fallback
    # Should probably fix this
    "unused-async", # unused-async

    # Security linter
    "subprocess-without-shell-equals-true", # subprocess-without-shell-equals-true
    # Should probably fix this
    "hardcoded-bind-all-interfaces", # hardcoded-bind-all-interfaces
    "try-except-pass", # try-except-pass
    "suspicious-non-cryptographic-random-usage", # suspicious-non-cryptographic-random-usage
    "hardcoded-sql-expression", # hardcoded-sql-expression
    # Need review on which of these we can/should fix
    "assert", # assert
    "suspicious-subprocess-import", # suspicious-subprocess-import
    "start-process-with-partial-path", # start-process-with-partial-path

    # Should fix
    "FBT",  # boolean positional usage: ~2100 errors
    "ANN",  # function annotations: ~1100 errors  # Gets fixed with mypy-exclusion removal
    "G",  # logging format: ~1000 errors
    "RET",  # return linting: ~700 errors
    "B",  # potential bugs linting: ~600 errors
    "PT",  # pytest styling: ~600 errors
    "pytest-fixture-autouse",  # autouse fixtures are used extensively across the codebase
    "SIM",  # code simplifications: ~500 errors
    "A",  # bad behavior relative to builtins: ~200 errors
    "PTH",  # pathlib linting: ~200 errors
    # Might be nice, might be annoying
    "blind-except",  # blind exceptions: ~300 errors
    "D",  # docstrings: ~9000 errors,
    "TRY",  # proper exception behavior: ~1300 errors
    "EM",  # exception messages: ~1000 errors
    "C",  # comprehensions: ~600 errors
    "SLF",  # private member access: ~600 errors
    "FURB",  # "refurbishing" and "modernizing": ~200 errors
    "PERF",  # anti-pattern linting: ~200 errors
    "N",  # pep8 naming: ~200 errors
    # Probably fine for our purposes
    "missing-trailing-comma",  # trailing commas: ~5000 errors
    "missing-copyright-notice",  # copyright notices: ~900 errors
    "TC",  # type checking linting: ~1700 errors  # Too much reliance on runtime types to enable this
    "T20",  # using print: ~1300 errors  # might want to enable this but not for CLI or tools/
    "TD",  # formatting of TODOs: ~800 errors
    "DOC",  # also docstrings: ~700 errors
    "ARG",  # unused arguments: ~500 errors
    "ERA",  # commented out code: ~400 errors
    "DTZ",  # datetimez:  <50 errors  # likely needs the tzlocal library as a dependency
    "FIX",  # TODOs, etc: ~400 errors
]

[lint.per-file-ignores]
"chia/_tests/*" = ["hardcoded-password-func-arg"]
"chia/__init__.py" = ["non-empty-init-module"]

[lint.flake8-implicit-str-concat]
# Found 3279 errors.
# allow-multiline = false

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
 "asyncio.create_task".msg = "Use `from chia.util.task_referencer import create_referenced_task` and `create_referenced_task()`"

[lint.isort]
required-imports = ["from __future__ import annotations"]

[lint.pylint]
max-args = 5
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-nested-blocks = 5
max-public-methods = 20
max-bool-expr = 5

[lint.pyupgrade]
keep-runtime-typing = true
