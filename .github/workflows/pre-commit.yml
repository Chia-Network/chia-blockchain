name: 🚨 pre-commit

on:
  pull_request:
  push:
    branches:
      - "long_lived/**"
      - main
      - "release/**"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Private pushes that only mirror public main skip this workflow.
  # On a public repo this job is skipped and the matrix below is unchanged.
  public-sync:
    name: "private only: public sync"
    if: github.repository_owner == 'Chia-Network' && github.event.repository.visibility == 'private' && github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Skip when the tree matches public main
        id: check
        run: |
          git fetch --depth=1 https://github.com/Chia-Network/chia-blockchain.git +refs/heads/main:refs/remotes/public/main
          if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'public/main^{tree}')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tree matches public main; skipping pre-commit."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  pre-commit:
    name: ${{ matrix.os.name }} ${{ matrix.arch.name }} ${{ matrix.python.major_dot_minor }}
    needs: public-sync
    if: |
      !cancelled() &&
      (needs.public-sync.result == 'skipped' || needs.public-sync.result == 'failure' || needs.public-sync.outputs.skip != 'true') &&
      !(github.repository_owner == 'Chia-Network' && github.event.repository.visibility == 'private')
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            matrix: linux
            runs-on:
              intel: ubuntu-latest
              arm: ubuntu-24.04-arm
          - name: macOS
            matrix: macos
            runs-on:
              intel: "macos-15-intel"
              arm: macos-latest
          - name: Windows
            matrix: windows
            runs-on:
              intel: windows-latest
        arch:
          - name: ARM64
            matrix: arm
          - name: Intel
            matrix: intel
        python:
          - major_dot_minor: "3.10"
          - major_dot_minor: "3.11"
          - major_dot_minor: "3.12"
          - major_dot_minor: "3.13"
          - major_dot_minor: "3.14"
        exclude:
          - os:
              matrix: windows
            arch:
              matrix: arm
          # Back to self hosted mac intel runners, which we have very few of
          - os:
              matrix: macos
            arch:
              matrix: intel

    steps:
      - name: Clean workspace
        uses: Chia-Network/actions/clean-workspace@main

      - uses: Chia-Network/actions/git-mark-workspace-safe@main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Chia-Network/actions/setup-python@main
        with:
          python-version: ${{ matrix.python.major_dot_minor }}

      - uses: ./.github/actions/install
        with:
          python-version: ${{ matrix.python.major_dot_minor }}
          development: true

      - uses: chia-network/actions/activate-venv@main

      - env:
          CHIA_MANAGE_CLVM_CHECK_USE_CACHE: "false"
          CHIA_MANAGE_MYPY_CHECK_EXCLUSIONS: "true"
        run: pre-commit run --all-files --verbose

  pre-commit-private:
    name: "private only: Linux Intel 3.12"
    needs: public-sync
    if: |
      !cancelled() &&
      github.repository_owner == 'Chia-Network' &&
      github.event.repository.visibility == 'private' &&
      (needs.public-sync.result == 'skipped' || needs.public-sync.result == 'failure' || needs.public-sync.outputs.skip != 'true')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Clean workspace
        uses: Chia-Network/actions/clean-workspace@main

      - uses: Chia-Network/actions/git-mark-workspace-safe@main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Chia-Network/actions/setup-python@main
        with:
          python-version: "3.12"

      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: true

      - uses: chia-network/actions/activate-venv@main

      - env:
          CHIA_MANAGE_CLVM_CHECK_USE_CACHE: "false"
          CHIA_MANAGE_MYPY_CHECK_EXCLUSIONS: "true"
        run: pre-commit run --all-files --verbose
