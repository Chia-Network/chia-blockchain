# This file is managed by the repo-content-updater project. Manual changes here will result in a PR to bring back
# repo-content-updater:dependency-artifact-review
name: Dependency Artifact Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to analyze"
        required: true
        type: number
      updated_dependencies_json:
        description: "fetch-metadata updated-dependencies-json for the PR"
        required: false
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.repository_owner == 'Chia-Network' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs: { pr_number: "${{ steps.pr.outputs.number }}" }
    steps:
      - name: Checkout trusted review scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-dcr-scripts
          sparse-checkout: |
            .github/scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve target PR and collect diff
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCH_PR: ${{ github.event.inputs.pr_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          number="${PR_NUMBER:-${DISPATCH_PR}}"
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "A numeric PR number is required." >&2; exit 1; }
          if [ "$(gh api "repos/${GH_REPO}/pulls/${number}" --jq '.user.login')" != "dependabot[bot]" ]; then
            echo "PR author is not dependabot[bot]." >&2
            exit 1
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          mkdir -p "${RUNNER_TEMP}/pr-diff"
          gh pr diff "$number" > "${RUNNER_TEMP}/pr-diff/pr.diff"
      - name: Fetch dependency metadata
        id: metadata
        if: github.event_name == 'pull_request'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Fetch published artifacts
        id: fetch
        env:
          UPDATED_DEPENDENCIES_JSON: >-
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.updated_dependencies_json || steps.metadata.outputs['updated-dependencies-json'] }}
          PR_DIFF_PATH: ${{ runner.temp }}/pr-diff/pr.diff
          DCR_OUT: ${{ runner.temp }}/dcr-review
        run: |
          set -euo pipefail
          python3 -I .trusted-dcr-scripts/.github/scripts/dcr_fetch.py
          cp .trusted-dcr-scripts/.github/scripts/dcr_prompt.md "${DCR_OUT}/dcr_prompt.md"
      - name: Install Cursor CLI
        if: steps.fetch.outputs.reviewable == 'true'
        env:
          CURSOR_CLI_VERSION: 2026.10.22-27dcf5f
          CURSOR_CLI_SHA256: 85296944e4600a83c4b764f578d1502bf9c416db200d33a593e8f3ecabfdc294
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/cursor-cli"
          tarball="${RUNNER_TEMP}/cursor-cli.tar.gz"
          mkdir -p "$install_dir"
          curl -fsSL "https://downloads.cursor.com/lab/${CURSOR_CLI_VERSION}/linux/x64/agent-cli-package.tar.gz" -o "$tarball"
          printf '%s  %s\n' "$CURSOR_CLI_SHA256" "$tarball" | sha256sum -c -
          tar --strip-components=1 -xzf "$tarball" -C "$install_dir"
          ln -s "$install_dir/cursor-agent" "$install_dir/agent"
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Run Cursor agent
        if: steps.fetch.outputs.reviewable == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/dcr-review"
          mkdir -p "$out"
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "CURSOR_API_KEY is not set; the review was skipped." >"${out}/agent_output.txt"
            exit 0
          fi
          stream_file="$(mktemp)"
          trap 'rm -f "$stream_file"' EXIT
          (cd "$out" && agent -f --mode ask -p --output-format stream-json < dcr_prompt.md) > "$stream_file"
          jq -rRs '
            [split("\n")[] | fromjson? | select(type == "object")]
            | (map(select(.type == "result") | .result) | last // "") as $result
            | if $result != "" then $result
              else (map(select(.type == "assistant") | [.message.content[]? | .text // ""] | join(""))
                    | map(select(length > 0)) | last // "")
              end
          ' "$stream_file" > "${out}/agent_output.txt"
      - name: Upload review results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dcr-review-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dcr-review/meta.json
            ${{ runner.temp }}/dcr-review/agent_output.txt
  dependency-artifact-review:
    needs: review
    if: ${{ always() && !cancelled() && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      MALWARE_WARN_ONLY: >-
        1
    steps:
      - name: Checkout trusted verdict script
        if: ${{ always() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-dcr-scripts
          sparse-checkout: |
            .github/scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download review results
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dcr-review-${{ github.run_id }}
          path: dcr-output
      - name: Decide and compose comment
        if: ${{ always() }}
        id: verdict
        env:
          DCR_META: ${{ github.workspace }}/dcr-output/meta.json
          DCR_AGENT_OUTPUT: ${{ github.workspace }}/dcr-output/agent_output.txt
          DCR_COMMENT: ${{ github.workspace }}/dcr-comment.md
        run: |
          set -euo pipefail
          python3 -I .trusted-dcr-scripts/.github/scripts/dcr_verdict.py
      - name: Post or update PR comment
        if: ${{ always() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.review.outputs.pr_number }}
          COMMENT_PATH: ${{ github.workspace }}/dcr-comment.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8');
            const number = Number(process.env.PR_NUMBER || '0');
            if (!number) return core.setFailed('No PR number was resolved.');
            const { owner, repo } = context.repo;
            const marker = '<!-- dcr-artifact-review -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const ours = comments
              .filter((c) => c.user?.type === 'Bot' && c.user?.login === 'github-actions[bot]' && c.body?.includes(marker))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (ours.length) return github.rest.issues.updateComment({ owner, repo, comment_id: ours[0].id, body });
            return github.rest.issues.createComment({ owner, repo, issue_number: number, body });
      - name: Set the check result
        if: ${{ always() && steps.verdict.outputs.conclusion != 'success' }}
        run: |
          echo "Artifact review conclusion: ${{ steps.verdict.outputs.conclusion || 'missing' }}" >&2
          exit 1
