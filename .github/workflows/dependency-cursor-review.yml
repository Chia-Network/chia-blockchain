# This file is managed by the repo-content-updater project. Manual changes here will result in a PR to bring back
# inline with the upstream template, unless you add !dependency-cursor-review to the repo's managed-files property
# repo-content-updater:dependency-cursor-review
# Dependency Cursor Review workflow
#
# Three jobs, three runners. The agent job is the only one that runs `agent`,
# and it cannot reach the machine that checks the scan digest or posts the
# verdict. The required check is the `dependency-review` job.
#
# Dependabot pull_request runs again on rebase, recreate, and rebuild. The
# marker is the stable patch id of the PR diff plus the peeled release commit.
# A later run skips the agent when that tag still peels to the recorded commit.
# The marker is stamped only when the published check passes. The release
# tree is scanned on every run, including a skip, and that fresh sealed
# report is enforced on every run. A scan whose status is not clean does
# not fail the check by itself.
name: Dependency Cursor Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot/Renovate PR number to analyze"
        required: true
        type: number

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.workflow_ref, github.event.inputs.pr_number) || github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review-scan:
    if: github.repository_owner == 'Chia-Network' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      already_reviewed: ${{ steps.bind_review.outputs.already_reviewed }}
      review_marker: ${{ steps.bind_review.outputs.review_marker }}
      number: ${{ steps.target_pr.outputs.number }}
      title: ${{ steps.target_pr.outputs.title }}
      head_sha: ${{ steps.target_pr.outputs.head_sha }}
      package_name: ${{ steps.malware_scan.outputs.package_name }}
      from_version: ${{ steps.malware_scan.outputs.from_version }}
      to_version: ${{ steps.malware_scan.outputs.to_version }}
      upstream_repo: ${{ steps.malware_scan.outputs.upstream_repo }}
      resolved_from: ${{ steps.malware_scan.outputs.resolved_from }}
      resolved_to: ${{ steps.malware_scan.outputs.resolved_to }}
      from_tag: ${{ steps.malware_scan.outputs.from_tag }}
      to_tag: ${{ steps.malware_scan.outputs.to_tag }}
      report_sha256: ${{ steps.malware_scan.outputs.report_sha256 }}
      summary: ${{ steps.malware_scan.outputs.summary }}
      scan_conclusive: ${{ steps.malware_scan.outputs.scan_conclusive }}
    steps:
      - name: Checkout trusted review scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-dcr-scripts
          sparse-checkout: |
            .github/scripts/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The PR-head checkout below replaces the workspace. Scripts run from, and
      # outputs go to, fresh directories outside it.
      - name: Copy trusted scripts out of the workspace
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/trusted-dcr-scripts"
          mkdir "${dest}" "${RUNNER_TEMP}/dcr-out"
          cp -a .trusted-dcr-scripts/.github/scripts/. "${dest}/"
          test -s "${dest}/dependency-cursor-review-target-pr.js"
          test -s "${dest}/dependency_update_coverage.py"

      - name: Resolve target PR context
        id: target_pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = require(`${process.env.RUNNER_TEMP}/trusted-dcr-scripts/dependency-cursor-review-target-pr.js`);
            await run.run({ github, context, core });

      - name: Checkout repository
        uses: actions/checkout@v7
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
        with:
          ref: ${{ steps.target_pr.outputs.head_sha }}
          persist-credentials: false

      - name: Extract Dependabot comment context
        uses: actions/github-script@v9
        env:
          PR_BODY: ${{ steps.target_pr.outputs.body }}
          PR_NUMBER: ${{ steps.target_pr.outputs.number }}
          DCR_OUT: ${{ runner.temp }}/dcr-out
        with:
          script: |
            const run = require(`${process.env.RUNNER_TEMP}/trusted-dcr-scripts/dependency-cursor-review-dependabot-context.js`);
            await run();

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run upstream malware scan
        id: malware_scan
        shell: bash
        env:
          PR_BASE_SHA: ${{ steps.target_pr.outputs.base_sha }}
          DCR_OUT: ${{ runner.temp }}/dcr-out
          DCR_FETCH_TOKEN: ${{ github.token }}
          MALWARE_IOC_PATTERNS: >-
            ["axios@1\\.14\\.1", "axios@0\\.30\\.4", "plain-crypto-js", "sfrclak\\.com", "@shadanai/openclaw", "@shadanai/[a-z0-9._-]+", "2026\\.3\\.28-2", "2026\\.3\\.28-3", "2026\\.3\\.31-1", "2026\\.3\\.31-2"]
          MALWARE_IOC_ALLOWLIST: >-
            []
          MALWARE_UNICODE_ALLOWLIST: >-
            []
          MALWARE_CONFUSABLE_ALLOWLIST: >-
            []
          MALWARE_HEURISTIC_ALLOWLIST: >-
            []
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
          python3 -I "${RUNNER_TEMP}/trusted-dcr-scripts/dependency_update_coverage.py"
          report="${DCR_OUT}/malware_scan_report.json"
          if [ ! -s "$report" ]; then
            echo "Malware scan report missing." >&2
            exit 1
          fi
          report_line="$(sha256sum "$report")"
          report_sha256="${report_line%% *}"
          if [ -z "$report_sha256" ]; then
            echo "Malware scan report digest was empty." >&2
            exit 1
          fi
          echo "report_sha256=${report_sha256}" >> "$GITHUB_OUTPUT"

      - name: Check out upstream release and drop agent instructions
        shell: bash
        env:
          RESOLVED_TO: ${{ steps.malware_scan.outputs.resolved_to }}
        run: |
          bash "${RUNNER_TEMP}/trusted-dcr-scripts/upstream_release_checkout.sh"

      - name: Gather local usage hints
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.malware_scan.outputs.package_name }}
          DCR_OUT: ${{ runner.temp }}/dcr-out
        run: |
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No package detected from PR metadata." >"${DCR_OUT}/package_usage.txt"
          else
            {
              echo "Search pattern: $PACKAGE_NAME"
              echo
              rg -n --fixed-strings --hidden --glob '!.git' --glob '!node_modules' --glob '!.upstream-dependency/**' -- "$PACKAGE_NAME" . || true
            } >"${DCR_OUT}/package_usage.txt"
          fi

      - name: Build Cursor prompts
        shell: bash
        env:
          PR_TITLE: ${{ steps.target_pr.outputs.title }}
          PR_BODY: ${{ steps.target_pr.outputs.body }}
          PACKAGE_NAME: ${{ steps.malware_scan.outputs.package_name }}
          FROM_VERSION: ${{ steps.malware_scan.outputs.from_version }}
          TO_VERSION: ${{ steps.malware_scan.outputs.to_version }}
          RESOLVED_FROM: ${{ steps.malware_scan.outputs.resolved_from }}
          RESOLVED_TO: ${{ steps.malware_scan.outputs.resolved_to }}
          DCR_OUT: ${{ runner.temp }}/dcr-out
        run: |
          python3 -I "${RUNNER_TEMP}/trusted-dcr-scripts/dependency_cursor_review_prompts.py"

      - name: Upload scan inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcr-scan-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dcr-out/malware_scan_report.json
            ${{ runner.temp }}/dcr-out/malware_scan_summary.md
            ${{ runner.temp }}/dcr-out/cursor_prompt_malware.txt
            ${{ runner.temp }}/dcr-out/cursor_prompt_compatibility.txt

      - name: Bind review marker to peeled commit
        id: bind_review
        if: always() && steps.malware_scan.outcome == 'success'
        uses: actions/github-script@v9
        env:
          PATCH_ID: ${{ steps.target_pr.outputs.patch_id }}
          REVIEWED_SHAS: ${{ steps.target_pr.outputs.reviewed_shas }}
          RESOLVED_TO: ${{ steps.malware_scan.outputs.resolved_to }}
        with:
          script: |
            const { bindReviewOutputs } = require(`${process.env.RUNNER_TEMP}/trusted-dcr-scripts/dependency-cursor-review-dependabot-context.js`);
            for (const [name, value] of Object.entries(bindReviewOutputs(process.env))) {
              core.setOutput(name, value);
            }

  dependency-review-agent:
    needs: dependency-review-scan
    if: ${{ needs.dependency-review-scan.result == 'success' && needs.dependency-review-scan.outputs.already_reviewed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        env:
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
        with:
          ref: ${{ needs.dependency-review-scan.outputs.head_sha }}
          persist-credentials: false

      # Only the trusted steps below create these paths, so none of them writes through a link.
      - name: Clear review paths from the checkout
        shell: bash
        run: rm -rf -- .dcr-strip .upstream-dependency dcr-scan-input

      - name: Checkout trusted instruction strip
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .dcr-strip
          sparse-checkout: |
            .github/scripts/upstream_release_checkout.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout upstream release
        if: ${{ needs.dependency-review-scan.outputs.resolved_to != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.dependency-review-scan.outputs.upstream_repo }}
          ref: ${{ needs.dependency-review-scan.outputs.resolved_to }}
          path: .upstream-dependency
          fetch-depth: 1
          persist-credentials: false

      - name: Download scan prompts
        uses: actions/download-artifact@v8
        with:
          name: dcr-scan-${{ github.run_id }}
          path: dcr-scan-input

      # Before anything reads them: refuse linked review paths and a non-regular
      # scan input, delete every symlink in the release, and drop agent instructions.
      - name: Prepare agent inputs
        shell: bash
        env:
          RESOLVED_TO: ${{ needs.dependency-review-scan.outputs.resolved_to }}
        run: |
          bash .dcr-strip/.github/scripts/upstream_release_checkout.sh

      - name: Fetch upstream commits and version tags
        if: ${{ needs.dependency-review-scan.outputs.resolved_to != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_FROM: ${{ needs.dependency-review-scan.outputs.resolved_from }}
          RESOLVED_TO: ${{ needs.dependency-review-scan.outputs.resolved_to }}
          FROM_TAG: ${{ needs.dependency-review-scan.outputs.from_tag }}
          TO_TAG: ${{ needs.dependency-review-scan.outputs.to_tag }}
        run: |
          set -euo pipefail
          auth_basic="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          # Pin both commits, then fetch only the named version tags.
          # Depth 1 does not include intermediate commits.
          fetch_sha() {
            local sha="$1"
            local refname="$2"
            [ -n "$sha" ] || return 0
            case "$sha" in
            *[!0-9a-fA-F]*)
              echo "Refusing non-SHA ref." >&2
              return 1
              ;;
            esac
            if [ "${#sha}" -lt 7 ] || [ "${#sha}" -gt 64 ]; then
              echo "Refusing non-SHA ref." >&2
              return 1
            fi
            git -C .upstream-dependency \
              -c "http.extraheader=AUTHORIZATION: basic ${auth_basic}" \
              fetch --no-tags --depth=1 origin "$sha"
            git -C .upstream-dependency update-ref "$refname" "$sha"
          }
          # One allowlist, next to the fetch and the peel check.
          # Slashes stay; the refspec stores that one tag.
          tag_name_ok() {
            local name="$1"
            [ -n "$name" ] || return 1
            case "$name" in
            *[!A-Za-z0-9._+/-]* | -* | .* | /* | *..* | *'@{'*) return 1 ;;
            esac
            return 0
          }
          fetch_tag() {
            local name="$1"
            local sha="$2"
            local got want
            [ -n "$name" ] || return 0
            if ! tag_name_ok "$name"; then
              echo "Refusing tag name." >&2
              return 1
            fi
            [ -n "$sha" ] || return 0
            # Tag following would also download every other tag on this commit.
            # The refspec still stores the named tag.
            git -C .upstream-dependency \
              -c "http.extraheader=AUTHORIZATION: basic ${auth_basic}" \
              fetch --no-tags --depth=1 origin "refs/tags/${name}:refs/tags/${name}" || return 1
            got="$(git -C .upstream-dependency rev-parse --verify --end-of-options "refs/tags/${name}^{commit}")" || return 1
            want="$(git -C .upstream-dependency rev-parse --verify --end-of-options "${sha}^{commit}")" || return 1
            if [ "$got" != "$want" ]; then
              # This function runs in a substitution, so errexit is off.
              git -C .upstream-dependency update-ref -d "refs/tags/${name}" || return 1
              return 0
            fi
            printf '%s\n' "$name"
          }
          # The compatibility prompt's last slot line is the layout placeholder.
          slot_token() {
            local file="dcr-scan-input/cursor_prompt_compatibility.txt"
            local line token=""
            local slot_re='^- (from|to) tag: \(none\) dcr-slot-([0-9a-f]{32})$'
            [ -f "$file" ] || return 1
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ $slot_re ]]; then
                token="${BASH_REMATCH[2]}"
              fi
            done <"$file"
            [ -n "$token" ] || return 1
            printf '%s\n' "$token"
          }
          note_tag() {
            local label="$1"
            local name="$2"
            local token="$3"
            local file tmp i changed
            local slot_re="^- ${label}: \\(none\\) dcr-slot-${token}$"
            local -a lines
            [ -n "$name" ] || return 0
            [[ "$token" =~ ^[0-9a-f]{32}$ ]] || return 1
            for file in dcr-scan-input/cursor_prompt_malware.txt dcr-scan-input/cursor_prompt_compatibility.txt; do
              [ -f "$file" ] || continue
              mapfile -t lines <"$file"
              changed=0
              for i in "${!lines[@]}"; do
                if [[ "${lines[$i]}" =~ $slot_re ]]; then
                  lines[i]="- ${label}: ${name}"
                  changed=1
                fi
              done
              [ "$changed" -eq 1 ] || continue
              tmp="$(mktemp)"
              printf '%s\n' "${lines[@]}" >"$tmp"
              mv "$tmp" "$file"
            done
          }
          fetch_sha "${RESOLVED_TO}" refs/dcr/to
          fetch_sha "${RESOLVED_FROM}" refs/dcr/from
          verified_to="$(fetch_tag "${TO_TAG:-}" "${RESOLVED_TO}")"
          verified_from="$(fetch_tag "${FROM_TAG:-}" "${RESOLVED_FROM}")"
          token="$(slot_token)"
          note_tag "from tag" "$verified_from" "$token"
          note_tag "to tag" "$verified_to" "$token"

      - name: Install Cursor CLI
        shell: bash
        run: |
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl https://cursor.com/install -fsSL -o "$installer"
          if [ ! -s "$installer" ]; then
            echo "Cursor installer download was empty."
            exit 1
          fi
          bash "$installer"
          for bin_dir in "$HOME/.cursor/bin" "$HOME/.local/bin"; do
            if [ -d "$bin_dir" ]; then
              echo "$bin_dir" >> "$GITHUB_PATH"
              export PATH="$bin_dir:$PATH"
            fi
          done
          if ! command -v agent >/dev/null 2>&1; then
            echo "Could not locate 'agent' binary after Cursor CLI install."
            exit 1
          fi

      - name: Refuse leftover credentials
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_TOKEN:-}" ] || [ -n "${GH_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is set." >&2
            exit 1
          fi
          for repo in . .upstream-dependency .dcr-strip; do
            if [ ! -e "${repo}/.git" ]; then
              continue
            fi
            if git -C "$repo" config --get-regexp '^http\..*extraheader' >/dev/null 2>&1; then
              echo "git http extraheader is set in ${repo}." >&2
              exit 1
            fi
          done

      - name: Run Cursor agent
        timeout-minutes: 10
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          ACTIONS_CACHE_URL: ""
          ACTIONS_RESULTS_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_TOKEN:-}" ] || [ -n "${GH_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is set." >&2
            exit 1
          fi
          out="${RUNNER_TEMP}/dcr-out"
          mkdir "$out"
          if [ -z "$CURSOR_API_KEY" ]; then
            skipped='{"result":"CURSOR_API_KEY is not set; analysis was skipped.","complete":false}'
            echo "$skipped" >"${out}/cursor_output_malware.json"
            echo "$skipped" >"${out}/cursor_output_compatibility.json"
            exit 0
          fi

          run_agent_prompt() {
            local prompt_file="$1"
            local output_file="$2"
            local stream_file
            stream_file="$(mktemp)"
            if ! agent -f --mode ask -p --output-format stream-json < "$prompt_file" > "$stream_file"; then
              FALLBACK_PROMPT="$(
                python3 -I - "$prompt_file" <<'PY'
          import sys

          max_bytes = 60000
          with open(sys.argv[1], "rb") as handle:
              raw = handle.read(max_bytes + 1)
          text = raw[:max_bytes].decode("utf-8", errors="ignore")
          if len(raw) > max_bytes:
              text += "\n\n[Prompt truncated for CLI argument compatibility.]"
          print(text, end="")
          PY
              )"
              agent -f --mode ask -p --output-format stream-json "$FALLBACK_PROMPT" > "$stream_file"
            fi
            python3 -I - "$stream_file" <<'PY' >"$output_file"
          import json
          import sys

          stream_path = sys.argv[1]
          result = ""
          final = ""
          with open(stream_path, encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(event, dict):
                      continue
                  if event.get("type") == "assistant":
                      text = "".join(
                          block.get("text", "")
                          for block in event.get("message", {}).get("content", [])
                          if isinstance(block, dict)
                      )
                      if text:
                          final = text
                  elif event.get("type") == "result":
                      result = event.get("result", "")
          payload = {"result": result or final, "final_message": final, "complete": bool(result or final)}
          json.dump(payload, sys.stdout)
          sys.stdout.write("\n")
          PY
          }

          run_agent_prompt "dcr-scan-input/cursor_prompt_malware.txt" "${out}/cursor_output_malware.json"
          run_agent_prompt "dcr-scan-input/cursor_prompt_compatibility.txt" "${out}/cursor_output_compatibility.json"

      - name: Upload agent outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcr-agent-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dcr-out/cursor_output_malware.json
            ${{ runner.temp }}/dcr-out/cursor_output_compatibility.json

  dependency-review:
    needs:
      - dependency-review-scan
      - dependency-review-agent
    if: ${{ always() && !cancelled() && needs.dependency-review-scan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      # A policy input to decide(), read once by the combine step.
      MALWARE_WARN_ONLY: >-
        1
    steps:
      - name: Fail closed when scan or agent failed
        if: ${{ needs.dependency-review-scan.result != 'success' || (needs.dependency-review-agent.result != 'success' && needs.dependency-review-agent.result != 'skipped') }}
        run: |
          echo "scan=${{ needs.dependency-review-scan.result }} agent=${{ needs.dependency-review-agent.result }}" >&2
          exit 1

      - name: Already reviewed
        if: ${{ needs.dependency-review-scan.result == 'success' && needs.dependency-review-scan.outputs.already_reviewed == 'true' }}
        run: echo "This dependency upgrade was already reviewed."

      - name: Checkout default-branch helpers
        id: helpers
        if: ${{ success() && needs.dependency-review-scan.result == 'success' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download scan inputs
        if: ${{ success() && steps.helpers.outcome == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: dcr-scan-${{ github.run_id }}
          path: dcr-scan-input

      - name: Download agent outputs
        id: agent_outputs
        if: ${{ success() && steps.helpers.outcome == 'success' && needs.dependency-review-scan.result == 'success' && needs.dependency-review-scan.outputs.already_reviewed != 'true' && needs.dependency-review-agent.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: dcr-agent-${{ github.run_id }}
          path: dcr-agent-output

      - name: Combine review
        if: ${{ success() && steps.helpers.outcome == 'success' && steps.agent_outputs.outcome == 'success' }}
        shell: bash
        env:
          MALWARE_SCAN_REPORT_SHA256: ${{ needs.dependency-review-scan.outputs.report_sha256 }}
          DCR_SCAN_REPORT: ${{ github.workspace }}/dcr-scan-input/malware_scan_report.json
          DCR_MALWARE_JSON: ${{ github.workspace }}/dcr-agent-output/cursor_output_malware.json
          DCR_COMPAT_JSON: ${{ github.workspace }}/dcr-agent-output/cursor_output_compatibility.json
          DCR_COMBINED_JSON: ${{ github.workspace }}/cursor_output.json
        run: |
          python3 -I .github/scripts/dependency_cursor_review_combine_outputs.py
          cp "$DCR_MALWARE_JSON" cursor_output_malware.json
          cp "$DCR_COMPAT_JSON" cursor_output_compatibility.json

      # The comment is posted for a blocking review too. selectPostedMarker stamps the
      # patch-id marker only when combine wrote complete: true, which requires check pass.
      - name: Post or update PR comment
        if: ${{ success() && steps.helpers.outcome == 'success' && steps.agent_outputs.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.dependency-review-scan.outputs.number }}
          REVIEW_MARKER: ${{ needs.dependency-review-scan.outputs.review_marker }}
          MALWARE_SCAN_SUMMARY: ${{ needs.dependency-review-scan.outputs.summary }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dependency-cursor-review-post-comment.js`);
            await run({ github, context, core });

      - name: Fail the check on a blocking review
        if: ${{ success() && steps.helpers.outcome == 'success' }}
        shell: bash
        env:
          MALWARE_SCAN_REPORT_SHA256: ${{ needs.dependency-review-scan.outputs.report_sha256 }}
          DCR_SCAN_REPORT: ${{ github.workspace }}/dcr-scan-input/malware_scan_report.json
          DCR_MALWARE_JSON: ${{ github.workspace }}/dcr-agent-output/cursor_output_malware.json
          DCR_COMPAT_JSON: ${{ github.workspace }}/dcr-agent-output/cursor_output_compatibility.json
        run: |
          python3 -I .github/scripts/dependency_cursor_review_combine_outputs.py --enforce-check || exit 1
