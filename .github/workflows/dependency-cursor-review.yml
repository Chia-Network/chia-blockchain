# Managed by repo-content-updater
# Dependency Cursor Review workflow
#
# Three jobs, three runners. The agent job is the only one that runs `agent`,
# and it cannot reach the machine that checks the scan digest or posts the
# verdict. The required check is the `dependency-review` job.
#
# Dependabot pull_request runs again on rebase, recreate, and rebuild. The
# marker is the stable patch id of the PR diff. A later run skips when
# github-actions[bot] has already commented that marker. The marker is stamped
# only when the combined review is complete. A skip leaves this check green.
name: Dependency Cursor Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot/Renovate PR number to analyze"
        required: true
        type: number

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.workflow_ref, github.event.inputs.pr_number) || github.event_name == 'pull_request' && format('{0}-{1}', github.workflow_ref, github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review-scan:
    if: github.repository_owner == 'Chia-Network' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      already_reviewed: ${{ steps.target_pr.outputs.already_reviewed }}
      review_marker: ${{ steps.target_pr.outputs.review_marker }}
      number: ${{ steps.target_pr.outputs.number }}
      title: ${{ steps.target_pr.outputs.title }}
      head_sha: ${{ steps.target_pr.outputs.head_sha }}
      package_name: ${{ steps.dependabot_context.outputs.package_name }}
      from_version: ${{ steps.dependabot_context.outputs.from_version }}
      to_version: ${{ steps.dependabot_context.outputs.to_version }}
      upstream_repo: ${{ steps.dependabot_context.outputs.upstream_repo }}
      resolved_from: ${{ steps.malware_scan.outputs.resolved_from }}
      resolved_to: ${{ steps.malware_scan.outputs.resolved_to }}
      status: ${{ steps.malware_scan.outputs.status }}
      changed_files_count: ${{ steps.malware_scan.outputs.changed_files_count }}
      report_sha256: ${{ steps.malware_scan.outputs.report_sha256 }}
      summary: ${{ steps.malware_scan.outputs.summary }}
    steps:
      - name: Checkout trusted target-PR helper
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-dcr-helper
          sparse-checkout: |
            .github/scripts/dependency-cursor-review-target-pr.js
            .github/scripts/dependency-cursor-review-dependabot-context.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy trusted helper out of the workspace
        shell: bash
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/trusted-dcr-helper"
          rm -rf "${dest}"
          mkdir -p "${dest}"
          cp -a .trusted-dcr-helper/.github/scripts/. "${dest}/"
          test -s "${dest}/dependency-cursor-review-target-pr.js"
          test -s "${dest}/dependency-cursor-review-dependabot-context.js"

      - name: Resolve target PR context
        id: target_pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = require(`${process.env.RUNNER_TEMP}/trusted-dcr-helper/dependency-cursor-review-target-pr.js`);
            await run.run({ github, context, core });

      - name: Checkout repository
        if: steps.target_pr.outputs.already_reviewed != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target_pr.outputs.head_sha }}
          persist-credentials: false

      # PR head is untrusted: overwrite composite action.yml from default branch before uses: ./…
      - name: Install trusted git path checkout action definition
        if: steps.target_pr.outputs.already_reviewed != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          action_file=".github/actions/trusted-git-path-checkout/action.yml"
          default_branch="${{ github.event.repository.default_branch }}"
          echo "Installing trusted composite action from origin/${default_branch} (not PR head definition)."
          auth_basic="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_basic}" \
            fetch --no-tags --depth=1 origin "${default_branch}"
          mkdir -p .github/actions/trusted-git-path-checkout
          git checkout "FETCH_HEAD" -- "${action_file}"
          if [ ! -f "$action_file" ]; then
            echo "Trusted composite action missing on origin/${default_branch} at ${action_file}."
            exit 1
          fi

      - name: Ensure malware verdict formatter bundle
        if: steps.target_pr.outputs.already_reviewed != 'true'
        uses: ./.github/actions/trusted-git-path-checkout
        with:
          token: ${{ github.token }}
          ref: ${{ github.event.repository.default_branch }}
          paths_manifest: .github/scripts/dependency-cursor-review-trusted-scripts.paths
          dest: ${{ runner.temp }}/trusted-dcr-scripts

      - name: Extract Dependabot comment context
        if: steps.target_pr.outputs.already_reviewed != 'true'
        id: dependabot_context
        uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ steps.target_pr.outputs.title }}
          PR_BODY: ${{ steps.target_pr.outputs.body }}
          PR_NUMBER: ${{ steps.target_pr.outputs.number }}
        with:
          script: |
            const run = require(`${process.env.RUNNER_TEMP}/trusted-dcr-scripts/.github/scripts/dependency-cursor-review-dependabot-context.js`);
            await run({ github, context, core });

      - name: Prepare upstream checkout directory
        if: steps.target_pr.outputs.already_reviewed != 'true'
        run: mkdir -p ".upstream-dependency"

      - name: Checkout upstream repository
        if: steps.target_pr.outputs.already_reviewed != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.dependabot_context.outputs.upstream_repo }}
          path: .upstream-dependency
          fetch-depth: 0
          persist-credentials: false

      - name: Run upstream malware scan
        if: steps.target_pr.outputs.already_reviewed != 'true'
        id: malware_scan
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.dependabot_context.outputs.package_name }}
          FROM_VERSION: ${{ steps.dependabot_context.outputs.from_version }}
          TO_VERSION: ${{ steps.dependabot_context.outputs.to_version }}
          MALWARE_WARN_ONLY: >-
            1
          MALWARE_IOC_PATTERNS: >-
            ["axios@1\\.14\\.1", "axios@0\\.30\\.4", "plain-crypto-js", "sfrclak\\.com", "@shadanai/openclaw", "@shadanai/[a-z0-9._-]+", "2026\\.3\\.28-2", "2026\\.3\\.28-3", "2026\\.3\\.31-1", "2026\\.3\\.31-2"]
          MALWARE_IOC_ALLOWLIST: >-
            []
          MALWARE_UNICODE_ALLOWLIST: >-
            []
          MALWARE_CONFUSABLE_ALLOWLIST: >-
            []
          MALWARE_HEURISTIC_ALLOWLIST: >-
            []
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep jq
          bash "${RUNNER_TEMP}/trusted-dcr-scripts/.github/scripts/upstream_malware_scan.sh"
          if [ ! -s malware_scan_report.json ]; then
            echo "Malware scan report missing." >&2
            exit 1
          fi
          report_line="$(sha256sum malware_scan_report.json)"
          report_sha256="${report_line%% *}"
          if [ -z "$report_sha256" ]; then
            echo "Malware scan report digest was empty." >&2
            exit 1
          fi
          echo "report_sha256=${report_sha256}" >> "$GITHUB_OUTPUT"

      - name: Check out upstream release and drop agent instructions
        if: steps.target_pr.outputs.already_reviewed != 'true'
        shell: bash
        run: |
          bash "${RUNNER_TEMP}/trusted-dcr-scripts/.github/scripts/upstream_release_checkout.sh"

      - name: Gather local usage hints
        if: steps.target_pr.outputs.already_reviewed != 'true'
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.dependabot_context.outputs.package_name }}
        run: |
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No package detected from PR metadata." > package_usage.txt
          else
            {
              echo "Search pattern: $PACKAGE_NAME"
              echo
              rg -n --fixed-strings --hidden --glob '!.git' --glob '!node_modules' --glob '!.upstream-dependency/**' -- "$PACKAGE_NAME" . || true
            } > package_usage.txt
          fi

      - name: Build Cursor prompts
        if: steps.target_pr.outputs.already_reviewed != 'true'
        shell: bash
        env:
          PR_TITLE: ${{ steps.target_pr.outputs.title }}
          PR_BODY: ${{ steps.target_pr.outputs.body }}
          PACKAGE_NAME: ${{ steps.dependabot_context.outputs.package_name }}
          FROM_VERSION: ${{ steps.dependabot_context.outputs.from_version }}
          TO_VERSION: ${{ steps.dependabot_context.outputs.to_version }}
        run: |
          python3 -I "${RUNNER_TEMP}/trusted-dcr-scripts/.github/scripts/dependency_cursor_review_prompts.py"
          if [ ! -f upstream_changed_files.txt ]; then
            : > upstream_changed_files.txt
          fi

      - name: Upload scan inputs
        if: always() && steps.target_pr.outputs.already_reviewed != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dcr-scan-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            malware_scan_report.json
            malware_scan_summary.md
            upstream_changed_files.txt
            cursor_prompt_malware.txt
            cursor_prompt_compatibility.txt

  dependency-review-agent:
    needs: dependency-review-scan
    if: ${{ needs.dependency-review-scan.result == 'success' && needs.dependency-review-scan.outputs.already_reviewed != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.dependency-review-scan.outputs.head_sha }}
          persist-credentials: false

      - name: Checkout trusted instruction strip
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .dcr-strip
          sparse-checkout: |
            .github/scripts/upstream_release_checkout.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout upstream release
        if: ${{ needs.dependency-review-scan.outputs.resolved_to != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.dependency-review-scan.outputs.upstream_repo }}
          ref: ${{ needs.dependency-review-scan.outputs.resolved_to }}
          path: .upstream-dependency
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch upstream from commit
        if: ${{ needs.dependency-review-scan.outputs.resolved_from != '' && needs.dependency-review-scan.outputs.resolved_to != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVED_FROM: ${{ needs.dependency-review-scan.outputs.resolved_from }}
        run: |
          set -euo pipefail
          auth_basic="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -C .upstream-dependency \
            -c "http.extraheader=AUTHORIZATION: basic ${auth_basic}" \
            fetch --no-tags --depth=1 origin "${RESOLVED_FROM}"

      - name: Drop agent instructions
        if: ${{ needs.dependency-review-scan.outputs.resolved_to != '' }}
        shell: bash
        env:
          RESOLVED_TO: ${{ needs.dependency-review-scan.outputs.resolved_to }}
        run: |
          bash .dcr-strip/.github/scripts/upstream_release_checkout.sh

      - name: Download scan prompts
        uses: actions/download-artifact@v7
        with:
          name: dcr-scan-${{ github.run_id }}
          path: dcr-scan-input

      - name: Install Cursor CLI
        shell: bash
        run: |
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl https://cursor.com/install -fsSL -o "$installer"
          if [ ! -s "$installer" ]; then
            echo "Cursor installer download was empty."
            exit 1
          fi
          bash "$installer"
          for bin_dir in "$HOME/.cursor/bin" "$HOME/.local/bin"; do
            if [ -d "$bin_dir" ]; then
              echo "$bin_dir" >> "$GITHUB_PATH"
              export PATH="$bin_dir:$PATH"
            fi
          done
          if ! command -v agent >/dev/null 2>&1; then
            echo "Could not locate 'agent' binary after Cursor CLI install."
            exit 1
          fi

      - name: Refuse leftover credentials
        shell: bash
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_TOKEN:-}" ] || [ -n "${GH_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is set." >&2
            exit 1
          fi
          for repo in . .upstream-dependency .dcr-strip; do
            if [ ! -e "${repo}/.git" ]; then
              continue
            fi
            if git -C "$repo" config --get-regexp '^http\..*extraheader' >/dev/null 2>&1; then
              echo "git http extraheader is set in ${repo}." >&2
              exit 1
            fi
          done

      - name: Run Cursor agent
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_TOKEN:-}" ] || [ -n "${GH_TOKEN:-}" ]; then
            echo "GITHUB_TOKEN is set." >&2
            exit 1
          fi
          if [ -z "$CURSOR_API_KEY" ]; then
            echo '{"result":"CURSOR_API_KEY is not set; analysis was skipped.","complete":false}' > cursor_output_malware.json
            echo '{"result":"CURSOR_API_KEY is not set; analysis was skipped.","complete":false}' > cursor_output_compatibility.json
            exit 0
          fi

          run_agent_prompt() {
            local prompt_file="$1"
            local output_file="$2"
            if ! agent -f --mode ask -p --output-format json < "$prompt_file" > "$output_file"; then
              FALLBACK_PROMPT="$(python3 -c 'from pathlib import Path; import sys; path = sys.argv[1]; max_bytes = 60000; raw = Path(path).read_bytes(); text = raw[:max_bytes].decode("utf-8", errors="ignore"); text += "\n\n[Prompt truncated for CLI argument compatibility.]" if len(raw) > max_bytes else ""; print(text, end="")' "$prompt_file")"
              agent -f --mode ask -p --output-format json "$FALLBACK_PROMPT" > "$output_file"
            fi
          }

          run_agent_prompt "dcr-scan-input/cursor_prompt_malware.txt" "cursor_output_malware.json"
          run_agent_prompt "dcr-scan-input/cursor_prompt_compatibility.txt" "cursor_output_compatibility.json"

      - name: Upload agent outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dcr-agent-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            cursor_output_malware.json
            cursor_output_compatibility.json

  dependency-review:
    needs:
      - dependency-review-scan
      - dependency-review-agent
    if: ${{ always() && !cancelled() && needs.dependency-review-scan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Fail closed when scan or agent failed
        if: ${{ needs.dependency-review-scan.result != 'success' || (needs.dependency-review-agent.result != 'success' && needs.dependency-review-agent.result != 'skipped') }}
        run: |
          echo "scan=${{ needs.dependency-review-scan.result }} agent=${{ needs.dependency-review-agent.result }}" >&2
          exit 1

      - name: Already reviewed
        if: ${{ needs.dependency-review-scan.result == 'success' && needs.dependency-review-scan.outputs.already_reviewed == 'true' }}
        run: echo "This dependency upgrade was already reviewed."

      - name: Checkout default-branch helpers
        id: helpers
        if: ${{ success() && needs.dependency-review-scan.result == 'success' && needs.dependency-review-scan.outputs.already_reviewed != 'true' && needs.dependency-review-agent.result == 'success' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download scan inputs
        if: ${{ success() && steps.helpers.outcome == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: dcr-scan-${{ github.run_id }}
          path: dcr-scan-input

      - name: Download agent outputs
        if: ${{ success() && steps.helpers.outcome == 'success' }}
        uses: actions/download-artifact@v7
        with:
          name: dcr-agent-${{ github.run_id }}
          path: dcr-agent-output

      - name: Combine review
        if: ${{ success() && steps.helpers.outcome == 'success' }}
        shell: bash
        env:
          MALWARE_SCAN_REPORT_SHA256: ${{ needs.dependency-review-scan.outputs.report_sha256 }}
          DCR_SCAN_REPORT: ${{ github.workspace }}/dcr-scan-input/malware_scan_report.json
          DCR_MALWARE_JSON: ${{ github.workspace }}/dcr-agent-output/cursor_output_malware.json
          DCR_COMPAT_JSON: ${{ github.workspace }}/dcr-agent-output/cursor_output_compatibility.json
          DCR_COMBINED_JSON: ${{ github.workspace }}/cursor_output.json
        run: |
          python3 -I .github/scripts/dependency_cursor_review_combine_outputs.py
          cp "$DCR_MALWARE_JSON" cursor_output_malware.json
          cp "$DCR_COMPAT_JSON" cursor_output_compatibility.json

      # The patch-id marker is posted only after combine writes a complete review.
      # selectPostedMarker in the default-branch helper drops it otherwise.
      - name: Post or update PR comment
        if: ${{ success() && steps.helpers.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.dependency-review-scan.outputs.number }}
          REVIEW_MARKER: ${{ needs.dependency-review-scan.outputs.review_marker }}
          MALWARE_SCAN_STATUS: ${{ needs.dependency-review-scan.outputs.status }}
          MALWARE_SCAN_CHANGED_COUNT: ${{ needs.dependency-review-scan.outputs.changed_files_count }}
          MALWARE_SCAN_SUMMARY: ${{ needs.dependency-review-scan.outputs.summary }}
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/dependency-cursor-review-post-comment.js`);
            await run({ github, context, core });
