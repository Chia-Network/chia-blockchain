name: 🚨🚀 Lint and upload source distribution

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - "long_lived/**"
      - main
      - "release/**"
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
    branches:
      - "**"

concurrency:
  # A public ready_for_review run only skips jobs. Keep it out of the pull request
  # group so it does not cancel the in-flight opened or synchronize run.
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}{2}', github.workflow_ref, github.event.pull_request.number, github.event.action == 'ready_for_review' && !(github.repository_owner == 'Chia-Network' && github.event.repository.visibility == 'private') && '-noop' || '') || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Private pushes that only mirror public main skip this workflow.
  # On a public repo this job is skipped and the matrix below is unchanged.
  public-sync:
    name: Public sync
    if: github.repository_owner == 'Chia-Network' && github.event.repository.visibility == 'private' && github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Skip when the tree matches public main
        id: check
        run: |
          git fetch --depth=1 https://github.com/Chia-Network/chia-blockchain.git +refs/heads/main:refs/remotes/public/main
          if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'public/main^{tree}')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Tree matches public main; skipping lint."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  mypy:
    name: ${{ matrix.os.emoji }} ${{ matrix.arch.emoji }} ${{ matrix.check.name }} - ${{ matrix.os.name }} ${{ matrix.python.major_dot_minor }}
    needs: public-sync
    if: |
      !cancelled() &&
      github.repository_owner == 'Chia-Network' &&
      (needs.public-sync.result == 'skipped' || needs.public-sync.result == 'failure' || needs.public-sync.outputs.skip != 'true') &&
      !(github.event.repository.visibility == 'private' && github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (github.event.action != 'ready_for_review' || github.event.repository.visibility == 'private') &&
      github.event.repository.visibility != 'private'
    runs-on: ${{ matrix.os.runs-on[matrix.arch.matrix] }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            matrix: linux
            emoji: 🐧
            runs-on:
              intel: ubuntu-latest
              arm: ubuntu-24.04-arm
          - name: macOS
            matrix: macos
            emoji: 🍎
            runs-on:
              intel: macos-15-intel
              arm: macos-15
          - name: Windows
            matrix: windows
            emoji: 🪟
            runs-on:
              intel: windows-latest
        arch:
          - name: ARM64
            emoji: 💪
            matrix: arm
          - name: Intel
            emoji: 🌀
            matrix: intel
        python:
          - major_dot_minor: "3.10"
          - major_dot_minor: "3.11"
          - major_dot_minor: "3.12"
          - major_dot_minor: "3.13"
          - major_dot_minor: "3.14"
        check:
          - name: mypy
            command: |
              echo "MYPY VERSION IS: $(mypy --version)"
              python manage-mypy.py build-mypy-ini
              mypy
        exclude:
          - os:
              matrix: windows
            arch:
              matrix: arm
          # Back to self hosted mac intel runners, which we have very few of
          - os:
              matrix: macos
            arch:
              matrix: intel

    steps:
      - uses: chia-network/actions/clean-workspace@main

      - name: Add safe git directory
        uses: chia-network/actions/git-mark-workspace-safe@main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: chia-network/actions/setup-python@main
        with:
          python-version: ${{ matrix.python.major_dot_minor }}

      - uses: ./.github/actions/install
        with:
          python-version: ${{ matrix.python.major_dot_minor }}
          development: true

      - uses: chia-network/actions/activate-venv@main

      - name: Check with ${{ matrix.check.name }}
        run: |
          ${{ matrix.check.command }}

  mypy-private:
    name: 🐧 🌀 mypy - Linux 3.12
    needs: public-sync
    if: |
      !cancelled() &&
      github.repository_owner == 'Chia-Network' &&
      github.event.repository.visibility == 'private' &&
      (needs.public-sync.result == 'skipped' || needs.public-sync.result == 'failure' || needs.public-sync.outputs.skip != 'true') &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: chia-network/actions/clean-workspace@main

      - name: Add safe git directory
        uses: chia-network/actions/git-mark-workspace-safe@main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: chia-network/actions/setup-python@main
        with:
          python-version: "3.12"

      - uses: ./.github/actions/install
        with:
          python-version: "3.12"
          development: true

      - uses: chia-network/actions/activate-venv@main

      - name: Check with mypy
        run: |
          echo "MYPY VERSION IS: $(mypy --version)"
          python manage-mypy.py build-mypy-ini
          mypy

  check:
    name: ${{ matrix.os.emoji }} ${{ matrix.check.name }} - ${{ matrix.os.name }} ${{ matrix.arch.name }} ${{ matrix.python.major_dot_minor }}
    needs: public-sync
    if: |
      !cancelled() &&
      github.repository_owner == 'Chia-Network' &&
      (needs.public-sync.result == 'skipped' || needs.public-sync.result == 'failure' || needs.public-sync.outputs.skip != 'true') &&
      !(github.event.repository.visibility == 'private' && github.event_name == 'pull_request' && github.event.pull_request.draft) &&
      (github.event.action != 'ready_for_review' || github.event.repository.visibility == 'private')
    runs-on: ${{ github.repository_owner == 'Chia-Network' && github.event.repository.visibility == 'private' && 'blacksmith-4vcpu-ubuntu-2404' || matrix.os.runs-on[matrix.arch.matrix] }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            matrix: linux
            emoji: 🐧
            runs-on:
              intel: ubuntu-latest
              arm: ubuntu-24.04-arm
        arch:
          - name: Intel
            matrix: intel
        python:
          - major_dot_minor: "3.12"
        check:
          - name: ruff
            command: ruff format --check --diff chia benchmarks tools
          - name: generated protocol tests
            command: |
              python3 -m chia._tests.util.build_network_protocol_files
              git diff --exit-code
          - name: poetry
            command: |
              .penv/bin/poetry check
          - name: actionlint
            command: |
              bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
              echo ==== shellcheck version
              shellcheck --version
              echo ==== actionlint version
              ./actionlint --version
              echo ==== running actionlint
              ./actionlint -color -shellcheck shellcheck

    steps:
      - uses: chia-network/actions/clean-workspace@main

      - name: Add safe git directory
        uses: chia-network/actions/git-mark-workspace-safe@main

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: chia-network/actions/setup-python@main
        with:
          python-version: ${{ matrix.python.major_dot_minor }}

      - uses: ./.github/actions/install
        with:
          python-version: ${{ matrix.python.major_dot_minor }}
          development: true

      - uses: chia-network/actions/activate-venv@main

      - name: Check with ${{ matrix.check.name }}
        run: |
          ${{ matrix.check.command }}

  upload_source_dist:
    name: Lint and Upload source distribution
    runs-on: ${{ github.event.repository.visibility == 'private' && 'blacksmith-4vcpu-ubuntu-2404' || matrix.os }}
    timeout-minutes: 30
    needs:
      - mypy
      - mypy-private
      - check
    if: |
      !cancelled() &&
      github.repository_owner == 'Chia-Network' &&
      needs.check.result == 'success' &&
      (needs.mypy.result == 'success' || needs.mypy-private.result == 'success')
    strategy:
      matrix:
        python:
          - major_dot_minor: "3.12"
        os: [ubuntu-latest]

    steps:
      - name: Add safe git directory
        uses: chia-network/actions/git-mark-workspace-safe@main

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: Chia-Network/actions/setup-python@main
        name: Install Python
        with:
          python-version: ${{ matrix.python.major_dot_minor }}

      - uses: ./.github/actions/install
        with:
          python-version: ${{ matrix.python.major_dot_minor }}
          development: true

      - uses: chia-network/actions/activate-venv@main

      - name: Build source distribution
        run: |
          python -m build --outdir dist .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist

      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
