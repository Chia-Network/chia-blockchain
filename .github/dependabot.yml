# This file is managed by the repo-content-updater project. Manual changes here will result in a PR to bring back
# inline with the upstream template, unless you add !dependabot to the repo's managed-files property

version: 2
registries:
  chia-pypi:
    type: python-index
    url: https://pypi.chia.net/simple/
  chia-downloads:
    type: python-index
    url: https://download.chia.net/simple/
updates:
  - package-ecosystem: "pip"
    registries:
      - chia-pypi
      - chia-downloads
    insecure-external-code-execution: allow
    directories: ["/"]
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 30
    rebase-strategy: auto
    labels:
      - dependencies
      - python
      - "Changed"
    reviewers: ["emlowe"]
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - github_actions
      - "Changed"
    reviewers: ["cameroncooper"]
